name: 构建共存版APK

# ============================================================
# 触发规则（Bannerlator 模式：push 只编译，tag 才发布，PR 自动验证）
#   - push 到 main        → 构建 APK，生成 artifacts，不创建 Release
#   - push v* 开头的 tag  → 构建 + 自检 + 发布 Release
#   - 创建/更新 PR        → 构建验证（编译 + 自检，不发布），PR 页面可直接看 CI 结果
#   - 手动运行           → 按当前 ref 类型决定是否发布（branch 不发布）
# ============================================================
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  NDK_VERSION: '24.0.8215888'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0   # 需要完整历史生成 changelog

      - name: 安装依赖
        run: |
          pip install zstandard
          sudo apt-get update -qq && sudo apt-get install -y -qq aapt apksigner unzip 2>/dev/null || true

      # ============================================================
      # 静态代码审查（编译前拦截，独立于编译结果）
      # Why: 仅靠"编译通过 + 真机不闪退"判断代码质量太滞后（两个信号都太晚）。
      #      本步骤在编译前扫描 native C/C++ 与 shell 脚本的高危问题：
      #        - cppcheck: 空指针/越界/未初始化/内存泄漏等确定性缺陷（error 阻断）
      #        - shellcheck: scripts/*.sh 语法与常见陷阱
      # What: error 级别直接终止构建（fail-fast）；warning 只打印不阻断，
      #       避免误报拖累正常构建（用户核心诉求：构建稳定优先）。
      # How:  删除本步骤即回退到"无静态审查"；--enable=error 只查确定性问题，
      #       误报率极低。Java 层由 gradle 编译时的 javac 承担（不跑全量 lint 以免拖垮 CI）。
      # ============================================================
      - name: 静态代码审查（cppcheck + shellcheck）
        run: |
          sudo apt-get install -y -qq cppcheck shellcheck 2>/dev/null || true
          echo "── 1/2 native C/C++ 静态审查（error 阻断）──"
          cppcheck --version
          cppcheck --enable=error --error-exitcode=1 --inline-suppr \
            --suppress=missingIncludeSystem --suppress=unknownMacro \
            --suppress=unmatchedSuppression \
            --std=c++17 \
            -I app/src/main/cpp/vortekrenderer/include \
            -I app/src/main/cpp/winlator/include \
            app/src/main/cpp/vortekrenderer/src \
            app/src/main/cpp/winlator/winfg 2>&1 | tail -60
          echo "native 审查通过 ✓（无 error 级缺陷）"
          echo ""
          echo "── 2/2 shell 脚本审查（仅警告，不阻断）──"
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x scripts/*.sh 2>&1 | tail -30 || true
          fi
          echo "静态审查完成"

      - name: 读取共存配置
        id: config
        run: |
          chmod +x scripts/apply-config.sh
          bash scripts/apply-config.sh coexist.properties app/build.gradle

      - name: 同步 win-fg 上游源码（native 帧生成引擎，MIT）
        run: |
          # Why: win-fg native 模式把帧生成编译进 host compositor（vortekrenderer），
          #      比 guest Vulkan layer 模式效果好（layer 模式生成帧被 host 丢弃，仅~25%提升）。
          #      构建时从上游拉取最新源码，自动跟随上游更新。
          # What: 下载 win-fg 核心源码到 app/src/main/cpp/winlator/winfg/，
          #      CMake 编译进 vortekrenderer。
          # How:  删除本步骤即回退到无帧生成版本。
          mkdir -p app/src/main/cpp/winlator/winfg
          WINFG_FILES="framegen.cpp framegen.hpp record_impl.inc config.hpp embedded_shaders.hpp vk_dispatch.hpp log.hpp"
          for f in $WINFG_FILES; do
            curl -fsSL -o "app/src/main/cpp/winlator/winfg/$f" \
              "https://raw.githubusercontent.com/The412Banner/win-fg/master/src/$f" \
              || { echo "::error::win-fg 源码下载失败: $f"; exit 1; }
          done
          curl -fsSL -o app/src/main/cpp/winlator/winfg/LICENSE.win-fg \
            "https://raw.githubusercontent.com/The412Banner/win-fg/master/LICENSE" || true
          curl -fsSL -o app/src/main/cpp/winlator/winfg/NOTICE_FIDELITYFX_OPTICALFLOW.md \
            "https://raw.githubusercontent.com/The412Banner/win-fg/master/NOTICE_FIDELITYFX_OPTICALFLOW.md" || true
          # vk_layer.h 是 Vulkan layer 接口头文件，NDK 不提供；framegen 不使用其内容，创建空 stub
          mkdir -p app/src/main/cpp/winlator/winfg/vulkan
          echo "// stub: vk_layer.h not needed for framegen (NDK does not ship it)" > app/src/main/cpp/winlator/winfg/vulkan/vk_layer.h
          ls -lh app/src/main/cpp/winlator/winfg/
          test -s app/src/main/cpp/winlator/winfg/framegen.cpp || { echo "::error::framegen.cpp 为空"; exit 1; }
          WINFG_COMMIT=$(git ls-remote https://github.com/The412Banner/win-fg.git refs/heads/master 2>/dev/null | awk '{print substr($1,1,12)}')
          echo "WINFG_VERSION=${WINFG_COMMIT:-unknown}" >> $GITHUB_ENV
          echo "win-fg 上游 commit: ${WINFG_COMMIT:-unknown}"

      - name: 应用 win-fg native 集成补丁
        run: |
          # Why: 15 个 native/Java/UI 文件改动合并为一个 patch（winfg-native.patch，仓库根目录），
          #      CI 构建时自动应用，避免在 GitHub 网页端逐个上传深层文件。
          # What: git apply 应用到工作树；失败则明确报错退出（不静默）。
          # How:  上游更新导致 patch 冲突时，用 scripts/rebuild-winfg-patch.sh 重建 patch。
          test -f winfg-native.patch || { echo "::error::winfg-native.patch 不存在（请在仓库根目录上传）"; exit 1; }
          if ! git apply --check winfg-native.patch 2>/dev/null; then
            echo "::error::winfg-native.patch 应用检查失败（可能上游更新了相关文件）"
            git apply --check --verbose winfg-native.patch 2>&1 | tail -5 || true
            exit 1
          fi
          git apply winfg-native.patch
          echo "win-fg native 补丁已应用 ✓"
          ls -la app/src/main/cpp/winlator/winfg/winfg_bridge.cpp

      - name: 对 assets 做等长包名替换
        run: |
          python3 scripts/patch-assets.py --config coexist.properties --assets-dir app/src/main/assets

      - name: 诊断：确认 assets 未丢失
        run: |
          echo "=== assets 目录大小 ==="
          du -sh app/src/main/assets/
          echo "=== rootfs.tzst ==="
          ls -lh app/src/main/assets/rootfs.tzst
          echo "=== win-fg 帧生成引擎 ==="
          ls -lh app/src/main/assets/winfg/
          echo "=== build.gradle 关键行 ==="
          grep -E "applicationId|versionCode|versionName" app/build.gradle

      - name: 校验 gradle.properties
        run: |
          cat gradle.properties
          grep -nE 'falseorg|trueorg|falsetrue' gradle.properties && { echo "::error::gradle.properties 属性粘连"; exit 1; } || true

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK（用 runner 预装，不下载）
        run: |
          # Why: android-actions/setup-android@v3/v4 在新 runner 上会误判
          #      sdkmanager 版本并尝试下载 commandline tools，常卡住失败。
          #      GitHub ubuntu runner 已预装 Android SDK，直接用即可。
          # What: 定位预装 sdkmanager，接受许可证，不下载任何东西。
          # How:  删掉本步骤恢复用 android-actions/setup-android。
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME" -maxdepth 5 -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::未找到 sdkmanager"
            ls -la "$ANDROID_HOME" 2>/dev/null || true
            find "$ANDROID_HOME" -maxdepth 3 -type d 2>/dev/null | head -20
            exit 1
          fi
          echo "使用 sdkmanager: $SDKMANAGER"
          # 接受许可证（重试 3 次）
          for i in 1 2 3; do
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 && break
            echo "许可证接受重试 $i..."
            sleep 2
          done
          echo "SDKMANAGER_PATH=$SDKMANAGER" >> $GITHUB_ENV
          echo "✅ Android SDK 就绪"

      - name: 安装 NDK 和 CMake
        run: |
          SDKMANAGER="${{ env.SDKMANAGER_PATH }}"
          echo "使用 sdkmanager: $SDKMANAGER"
          test -x "$SDKMANAGER" || { echo "::error::sdkmanager 路径无效: $SDKMANAGER"; exit 1; }
          NDK_DIR="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          # NDK：已预装则跳过，否则安装（自动接受许可证，2>/dev/null 抑制 Broken pipe）
          if [ -d "$NDK_DIR" ]; then
            echo "✅ NDK ${{ env.NDK_VERSION }} 已预装，跳过"
          else
            echo "安装 NDK ${{ env.NDK_VERSION }}..."
            yes 2>/dev/null | "$SDKMANAGER" --install "ndk;${{ env.NDK_VERSION }}" 2>&1 | tail -10
          fi
          # CMake：已预装则跳过
          if [ -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            echo "✅ CMake 3.22.1 已预装，跳过"
          else
            echo "安装 CMake 3.22.1..."
            yes 2>/dev/null | "$SDKMANAGER" --install "cmake;3.22.1" 2>&1 | tail -10
          fi
          # 最终验证
          test -d "$NDK_DIR" || { echo "::error::NDK 未安装成功，当前 ndk 目录:"; ls "$ANDROID_HOME/ndk/" 2>/dev/null || echo "(空)"; exit 1; }
          test -d "$ANDROID_HOME/cmake/3.22.1" || { echo "::error::CMake 未安装成功"; ls "$ANDROID_HOME/cmake/" 2>/dev/null || echo "(空)"; exit 1; }
          echo "✅ NDK 和 CMake 就绪"

      - name: 准备签名 keystore
        id: keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "使用自定义签名"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > custom.keystore
            echo "keystore_path=$PWD/custom.keystore" >> $GITHUB_OUTPUT
            echo "keystore_pass=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_OUTPUT
            echo "key_alias=${{ secrets.KEY_ALIAS }}" >> $GITHUB_OUTPUT
            echo "key_pass=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_OUTPUT
          else
            echo "使用 debug 签名"
            keytool -genkey -v -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US"
            echo "keystore_path=$PWD/debug.keystore" >> $GITHUB_OUTPUT
            echo "keystore_pass=android" >> $GITHUB_OUTPUT
            echo "key_alias=androiddebugkey" >> $GITHUB_OUTPUT
            echo "key_pass=android" >> $GITHUB_OUTPUT
          fi

      - name: 构建 Release APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=${{ steps.keystore.outputs.keystore_path }} \
            -Pandroid.injected.signing.store.password=${{ steps.keystore.outputs.keystore_pass }} \
            -Pandroid.injected.signing.key.alias=${{ steps.keystore.outputs.key_alias }} \
            -Pandroid.injected.signing.key.password=${{ steps.keystore.outputs.key_pass }} > build.log 2>&1
          GRADLE_EXIT=$?
          echo "Gradle 退出码: $GRADLE_EXIT"
          grep -nE "^e: |error:|FAILED|FAILURE:|What went wrong|> Task .*FAILED|Caused by:|Execution failed|ninja: error|clang.*error" build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "========== 最后 80 行 =========="
          tail -80 build.log
          if [ $GRADLE_EXIT -ne 0 ]; then
            echo "::error::Gradle 构建失败，退出码 $GRADLE_EXIT"
            exit 1
          fi

      - name: 确认 APK
        run: |
          ls -lh app/build/outputs/apk/release/
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      - name: 重命名 APK
        run: |
          SHA=$(git rev-parse --short HEAD)
          TS=$(date +%Y%m%d-%H%M%S)
          mv "$APK_PATH" "Winlator-coexist-${SHA}-${TS}.apk"
          ls -lh *.apk
          echo "APK_FINAL=$(ls *.apk | head -1)" >> $GITHUB_ENV

      - name: 发布前静态自检
        run: |
          chmod +x scripts/pre-release-check.sh
          bash scripts/pre-release-check.sh "$APK_FINAL" "${{ env.APP_ID }}"

      - name: 生成更新日志
        run: |
          chmod +x scripts/generate-changelog.sh
          bash scripts/generate-changelog.sh RELEASE_NOTES.md "${{ env.APP_ID }}"

      - name: 上传 APK（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: winlator-coexist-apk
          path: "*.apk"
          retention-days: 30

      # ============================================================
      # 发布 Release：仅当本次运行由 git tag 触发（Bannerlator 模式）
      # 普通 push / 手动运行（branch）→ 只编译，不发布
      # ============================================================
      - name: 发布 Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
          name: "Winlator 共存版 ${{ env.VERSION_NAME }} (${{ env.APP_ID }}) + win-fg ${{ env.WINFG_VERSION }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          # 自检全过无警告 → 正式版（自动 Latest）；有跳过项 → pre-release（需人工验证）
          prerelease: ${{ env.SELF_CHECK_NEED_MANUAL == '1' }}
          body_path: RELEASE_NOTES.md
          # 正式版自动设为 Latest，预发布版不覆盖 Latest
          make_latest: ${{ env.SELF_CHECK_NEED_MANUAL == '0' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
