name: 构建共存版APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  NDK_VERSION: '24.0.8215888'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: 安装 zstandard
        run: pip install zstandard

      - name: 对 assets 做等长包名替换（核心步骤）
        run: python3 scripts/patch-assets.py

      - name: 诊断：确认 assets 未丢失
        run: |
          echo "=== assets 目录大小 ==="
          du -sh app/src/main/assets/
          echo "=== rootfs.tzst 大小（应约 90MB+）==="
          ls -lh app/src/main/assets/rootfs.tzst

      - name: 校验 gradle.properties（防止属性粘连）
        run: |
          # 内存配置已直接写在仓库 gradle.properties 中；这里只校验每行都是合法 key=value
          cat gradle.properties
          grep -nE 'falseorg|trueorg|falsetrue' gradle.properties && { echo "::error::gradle.properties 出现属性粘连"; exit 1; } || true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 NDK 和 CMake
        run: sdkmanager --install "ndk;${{ env.NDK_VERSION }}" "cmake;3.22.1"

      - name: 创建签名 keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US"

      - name: 构建 Release APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=$PWD/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android > build.log 2>&1
          GRADLE_EXIT=$?
          echo "Gradle 退出码: $GRADLE_EXIT"
          # 把关键错误行提升为 GitHub annotation（不登录也能通过 API 看到）
          grep -nE "^e: |error:|FAILED|FAILURE:|What went wrong|> Task .*FAILED|Caused by:|Execution failed|ninja: error|clang.*error" build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "========== 最后 80 行 =========="
          tail -80 build.log
          if [ $GRADLE_EXIT -ne 0 ]; then
            echo "::error::Gradle 构建失败，退出码 $GRADLE_EXIT"
            exit 1
          fi

      - name: 确认 APK 大小
        run: |
          ls -lh app/build/outputs/apk/release/
          echo "APK 应约 150-200MB（含 assets），如果只有几 MB 说明 assets 丢失"

      - name: 重命名 APK
        run: |
          SHA=$(git rev-parse --short HEAD)
          TS=$(date +%Y%m%d-%H%M%S)
          mv app/build/outputs/apk/release/app-release.apk "Winlator-coexist-${SHA}-${TS}.apk"
          ls -lh *.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: winlator-coexist-apk
          path: "*.apk"
          retention-days: 30
