name: 构建共存版APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  NDK_VERSION: '24.0.8215888'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: 安装 zstandard
        run: pip install zstandard

      - name: 对 assets 做等长包名替换（核心步骤）
        run: python3 scripts/patch-assets.py

      - name: 诊断：确认 assets 未丢失
        run: |
          echo "=== assets 目录大小 ==="
          du -sh app/src/main/assets/
          echo "=== rootfs.tzst 大小（应约 90MB+）==="
          ls -lh app/src/main/assets/rootfs.tzst
          echo "=== build.gradle 内容 ==="
          cat app/build.gradle

      - name: 加大 Gradle 内存
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          cat gradle.properties

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 NDK 和 CMake
        run: sdkmanager --install "ndk;${{ env.NDK_VERSION }}" "cmake;3.22.1"

      - name: 创建签名 keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US"

      - name: 构建 Release APK（失败时输出完整错误）
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=$PWD/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android 2>&1 | tee build.log || {
              echo "========== 构建失败，最后 150 行日志 =========="
              tail -150 build.log
              exit 1
            }

      - name: 确认 APK 大小
        run: |
          ls -lh app/build/outputs/apk/release/
          echo "APK 应约 150-200MB（含 assets），如果只有几 MB 说明 assets 丢失"

      - name: 重命名 APK
        run: |
          SHA=$(git rev-parse --short HEAD)
          TS=$(date +%Y%m%d-%H%M%S)
          mv app/build/outputs/apk/release/app-release.apk "Winlator-coexist-${SHA}-${TS}.apk"
          ls -lh *.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: winlator-coexist-apk
          path: "*.apk"
          retention-days: 30
