name: 构建共存版APK

# ============================================================
# 触发规则（push 只编译，tag 才发布，PR 自动验证）
#   - push 到 main        → 构建 coexist 变体 APK，生成 artifacts，不创建 Release
#   - push v* 开头的 tag  → 构建 + 自检 + 发布 Release
#   - 创建/更新 PR        → 构建验证（编译 + 自检，不发布）
#   - 手动运行           → 按当前 ref 类型决定是否发布（branch 不发布）
#
# 包名由 app/build.gradle 的 productFlavors 决定（Gradle 官方多变体机制）：
#   standard → com.winlator（原版，本 CI 不发布，仅本地/手动验证）
#   coexist  → org.winlator（共存版，本 CI 构建并发布）
# 不再使用 apply-config.sh 占位符替换，也不在编译期改 assets；
# rootfs 内硬编码路径统一由 App 运行时的 core/PatchUtils.java 等长替换
# + 别名软链处理（与上游“MT 管理器改包”路线完全等价）。
# ============================================================
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  NDK_VERSION: '24.0.8215888'
  # 本 CI 发布的变体及其包名 / 版本名（与 build.gradle 的 coexist flavor 保持一致）
  FLAVOR: 'coexist'
  APP_ID: 'org.winlator'
  VERSION_NAME: '11.2.cn.04'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0   # 需要完整历史生成 changelog

      - name: 安装依赖
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq aapt apksigner unzip 2>/dev/null || true

      # ============================================================
      # 清理已废弃文件（旧占位符方案 + win-fg 死代码）
      # Why: 共存已改用 build.gradle 的 productFlavors + App 运行时 PatchUtils，
      #      旧的 apply-config.sh 占位符替换、patch-assets.py 编译期改 rootfs、
      #      win-fg 配置类均不再使用；保留它们会让 shellcheck 扫到旧脚本，
      #      死代码也可能被误引用。
      # What: 仅在 CI 工作区删除，保证本次构建干净；仓库里的副本可另行手动删除。
      # How:  删除本步骤即停止清理（文件仍在但不参与新流程）。
      # ============================================================
      - name: 清理废弃文件
        run: |
          rm -f scripts/apply-config.sh scripts/patch-assets.py coexist.properties
          rm -f app/src/main/java/com/winlator/core/WinFGConfig.java
          rm -f app/src/main/java/com/winlator/core/LogCaptureHelper.java
          echo "废弃文件清理完成"

      # ============================================================
      # 静态代码审查（编译前拦截，独立于编译结果）
      #   - cppcheck: 空指针/越界/未初始化/内存泄漏等确定性缺陷（error 阻断）
      #   - shellcheck: scripts/*.sh 语法与常见陷阱（仅警告不阻断）
      # 删除本步骤即回退到“无静态审查”。
      # ============================================================
      # ============================================================
      # 应用功能补丁（patches/ 目录下的 .patch 文件自动 git apply）
      # Why: 手机端逐个上传13个文件太麻烦，统一用 patch 一键应用
      # What: patches/frame-generation.patch 包含 alexvorxx 帧生成引擎全部改动
      # How:  删除本步骤即停止应用补丁（回滚到无帧生成状态）
      # ============================================================
      - name: 应用功能补丁
        run: |
          if [ -d patches ]; then
            for patch in patches/*.patch; do
              [ -f "$patch" ] || continue
              echo "应用补丁: $patch"
              git apply --verbose "$patch" && echo "  ✓ 成功" || echo "  ✗ 失败（可能已应用或冲突）"
            done
          else
            echo "patches/ 目录不存在，跳过补丁应用"
          fi

      - name: 静态代码审查（cppcheck + shellcheck）
        run: |
          sudo apt-get install -y -qq cppcheck shellcheck 2>/dev/null || true
          echo "── 1/2 native C/C++ 静态审查（error 阻断）──"
          cppcheck --version
          cppcheck --enable=error --error-exitcode=1 --inline-suppr \
            --suppress=missingIncludeSystem --suppress=unknownMacro \
            --suppress=unmatchedSuppression \
            --std=c++17 \
            -I app/src/main/cpp/vortekrenderer/include \
            -I app/src/main/cpp/winlator/include \
            app/src/main/cpp/vortekrenderer/src 2>&1 | tail -60
          echo "native 审查通过 ✓（无 error 级缺陷）"
          echo ""
          echo "── 2/2 shell 脚本审查（仅警告，不阻断）──"
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x scripts/*.sh 2>&1 | tail -30 || true
          fi
          echo "静态审查完成"

      - name: 诊断：确认变体配置与 assets 完整
        run: |
          echo "=== productFlavors 配置 ==="
          grep -nE 'flavorDimensions|productFlavors|standard|coexist|applicationId|versionCode|versionName' app/build.gradle
          echo "=== assets 目录大小（不应被任何步骤改写）==="
          du -sh app/src/main/assets/
          echo "=== rootfs.tzst ==="
          ls -lh app/src/main/assets/rootfs.tzst

      - name: 校验 gradle.properties
        run: |
          cat gradle.properties
          grep -nE 'falseorg|trueorg|falsetrue' gradle.properties && { echo "::error::gradle.properties 属性粘连"; exit 1; } || true

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK（用 runner 预装，不下载）
        run: |
          # android-actions/setup-android 在新 runner 上会误判 sdkmanager 版本并
          # 尝试下载 commandline tools，常卡住失败；GitHub ubuntu runner 已预装 SDK。
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME" -maxdepth 5 -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::未找到 sdkmanager"
            ls -la "$ANDROID_HOME" 2>/dev/null || true
            find "$ANDROID_HOME" -maxdepth 3 -type d 2>/dev/null | head -20
            exit 1
          fi
          echo "使用 sdkmanager: $SDKMANAGER"
          for i in 1 2 3; do
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 && break
            echo "许可证接受重试 $i..."
            sleep 2
          done
          echo "SDKMANAGER_PATH=$SDKMANAGER" >> $GITHUB_ENV
          echo "✅ Android SDK 就绪"

      - name: 安装 NDK 和 CMake
        run: |
          SDKMANAGER="${{ env.SDKMANAGER_PATH }}"
          test -x "$SDKMANAGER" || { echo "::error::sdkmanager 路径无效: $SDKMANAGER"; exit 1; }
          NDK_DIR="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          if [ -d "$NDK_DIR" ]; then
            echo "✅ NDK ${{ env.NDK_VERSION }} 已预装，跳过"
          else
            echo "安装 NDK ${{ env.NDK_VERSION }}..."
            yes 2>/dev/null | "$SDKMANAGER" --install "ndk;${{ env.NDK_VERSION }}" 2>&1 | tail -10
          fi
          if [ -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            echo "✅ CMake 3.22.1 已预装，跳过"
          else
            echo "安装 CMake 3.22.1..."
            yes 2>/dev/null | "$SDKMANAGER" --install "cmake;3.22.1" 2>&1 | tail -10
          fi
          test -d "$NDK_DIR" || { echo "::error::NDK 未安装成功，当前 ndk 目录:"; ls "$ANDROID_HOME/ndk/" 2>/dev/null || echo "(空)"; exit 1; }
          test -d "$ANDROID_HOME/cmake/3.22.1" || { echo "::error::CMake 未安装成功"; ls "$ANDROID_HOME/cmake/" 2>/dev/null || echo "(空)"; exit 1; }
          echo "✅ NDK 和 CMake 就绪"

      - name: 准备签名 keystore
        id: keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "使用自定义签名"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > custom.keystore
            echo "keystore_path=$PWD/custom.keystore" >> $GITHUB_OUTPUT
            echo "keystore_pass=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_OUTPUT
            echo "key_alias=${{ secrets.KEY_ALIAS }}" >> $GITHUB_OUTPUT
            echo "key_pass=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_OUTPUT
          else
            echo "使用 debug 签名"
            keytool -genkey -v -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US"
            echo "keystore_path=$PWD/debug.keystore" >> $GITHUB_OUTPUT
            echo "keystore_pass=android" >> $GITHUB_OUTPUT
            echo "key_alias=androiddebugkey" >> $GITHUB_OUTPUT
            echo "key_pass=android" >> $GITHUB_OUTPUT
          fi

      - name: Android Lint（Java/XML 静态检查，观察模式不阻断）
        run: |
          chmod +x gradlew
          echo "── 运行 Android Lint（coexist 变体，观察模式不阻断）──"
          set +e
          ./gradlew lintCoexistRelease --no-daemon --continue > lint.log 2>&1
          LINT_EXIT=$?
          echo "Lint 退出码: $LINT_EXIT（观察模式下非 0 不阻断）"
          echo "── Lint 结果摘要 ──"
          if [ -f app/build/reports/lint-results-coexistRelease.xml ]; then
            FATAL=$(grep -c 'severity="Fatal"' app/build/reports/lint-results-coexistRelease.xml 2>/dev/null || echo 0)
            ERROR=$(grep -c 'severity="Error"' app/build/reports/lint-results-coexistRelease.xml 2>/dev/null || echo 0)
            WARNING=$(grep -c 'severity="Warning"' app/build/reports/lint-results-coexistRelease.xml 2>/dev/null || echo 0)
            echo "  Fatal: $FATAL, Error: $ERROR, Warning: $WARNING"
            grep 'severity="Error"\|severity="Fatal"' app/build/reports/lint-results-coexistRelease.xml 2>/dev/null | head -10 | sed 's/.*id="\([^"]*\)".*message="\([^"]*\)".*/  [\1] \2/' | cut -c1-120
          else
            echo "  未生成报告，见 lint.log"
            tail -20 lint.log
          fi
          echo "Lint 完成（观察模式，不阻断）"

      - name: 构建 coexist Release APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleCoexistRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=${{ steps.keystore.outputs.keystore_path }} \
            -Pandroid.injected.signing.store.password=${{ steps.keystore.outputs.keystore_pass }} \
            -Pandroid.injected.signing.key.alias=${{ steps.keystore.outputs.key_alias }} \
            -Pandroid.injected.signing.key.password=${{ steps.keystore.outputs.key_pass }} > build.log 2>&1
          GRADLE_EXIT=$?
          echo "Gradle 退出码: $GRADLE_EXIT"
          grep -nE "^e: |error:|FAILED|FAILURE:|What went wrong|> Task .*FAILED|Caused by:|Execution failed|ninja: error|clang.*error" build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "========== 最后 80 行 =========="
          tail -80 build.log
          if [ $GRADLE_EXIT -ne 0 ]; then
            echo "::error::Gradle 构建失败，退出码 $GRADLE_EXIT"
            exit 1
          fi

      - name: 确认 APK
        run: |
          ls -lh app/build/outputs/apk/coexist/release/
          APK=$(ls app/build/outputs/apk/coexist/release/*.apk | head -1)
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      - name: 重命名 APK
        run: |
          SHA=$(git rev-parse --short HEAD)
          TS=$(date +%Y%m%d-%H%M%S)
          mv "$APK_PATH" "Winlator-coexist-${SHA}-${TS}.apk"
          ls -lh *.apk
          echo "APK_FINAL=$(ls *.apk | head -1)" >> $GITHUB_ENV

      - name: 发布前静态自检
        run: |
          chmod +x scripts/pre-release-check.sh
          bash scripts/pre-release-check.sh "$APK_FINAL" "${{ env.APP_ID }}"

      - name: 生成更新日志
        run: |
          chmod +x scripts/generate-changelog.sh
          bash scripts/generate-changelog.sh RELEASE_NOTES.md "${{ env.APP_ID }}"

      - name: 上传 APK（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: winlator-coexist-apk
          path: "*.apk"
          retention-days: 30

      # ============================================================
      # 发布 Release：仅当本次运行由 git tag 触发
      # 普通 push / 手动运行（branch）→ 只编译，不发布
      # ============================================================
      - name: 发布 Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
          name: "WinlatorCN ${{ env.VERSION_NAME }} 共存版"
          tag_name: ${{ github.ref_name }}
          draft: false
          # 自检全过无警告 → 正式版（自动 Latest）；有跳过项 → pre-release（需人工验证）
          prerelease: ${{ env.SELF_CHECK_NEED_MANUAL == '1' }}
          body_path: RELEASE_NOTES.md
          make_latest: ${{ env.SELF_CHECK_NEED_MANUAL == '0' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
