name: 同步上游（PR 模式）

# ============================================================
# 同步上游 → 开 PR（不再直接 push main）
#   - 每天 UTC 18:00 自动运行（北京时间次日 02:00）
#   - 可手动 Run workflow（可选"强制同步"输入）
#   - 上游有新提交时 → 合并到 auto-sync-<commit> 分支 → 开 PR 到 main
#   - PR 自动触发 build-coexist.yml 的 pull_request 构建验证
#   - 构建绿 → 用户审查后合并；构建红 → main 永远安全，等补丁
#
# Why（改造原因）: 旧版直接 merge 后 push main，上游大改时产生半合并
#      （上游新文件引用被保护文件的旧接口），坏状态直接污染 main，
#      构建失败只能靠手动补丁救。PR 模式把"验证"放到合并之前。
# How（回滚）:   想恢复旧行为，把"推送分支/开 PR"步骤改回 push origin main。
# ============================================================
on:
  schedule:
    - cron: '0 18 * * *'   # 每天 UTC 18:00 = 北京时间次日 02:00
  workflow_dispatch:
    inputs:
      force_sync:
        description: '强制同步（即使上游无新提交也重新生成 PR）'
        type: boolean
        default: false

# 并发锁：同一时间只允许一个运行，避免重复合并/重复开 PR
concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: 'hostei33/winlator-cn'
  UPSTREAM_BRANCH: 'main'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0   # 需要完整历史才能 merge

      - name: 配置 git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: 添加上游并拉取
        run: |
          git fetch origin main
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}" 2>&1 | tail -3
          echo "=== 上游最新提交 ==="
          git log upstream/${UPSTREAM_BRANCH} --oneline -1

      - name: 检查上游是否有新提交
        id: check
        run: |
          LOCAL=$(git rev-parse origin/main)
          UPSTREAM=$(git rev-parse upstream/${UPSTREAM_BRANCH})
          echo "本地 main: ${LOCAL:0:10}  上游: ${UPSTREAM:0:10}"
          if [ "$LOCAL" = "$UPSTREAM" ] && [ "${{ github.event.inputs.force_sync }}" != "true" ]; then
            echo "up_to_date=true" >> $GITHUB_OUTPUT
            echo "上游无新提交，跳过。"
          else
            echo "up_to_date=false" >> $GITHUB_OUTPUT
            echo "上游有新提交（或强制同步），开始合并。"
          fi

      # ============================================================
      # 【区域保护策略】冲突时以下文件/目录永远保留我们的版本
      #   OURS_FILES = 精确文件路径（新增定制文件时加这里）
      #   OURS_DIRS  = 整个目录保护（目录下任何文件冲突都保留 ours）
      #   EXCLUDE    = 上游有但我们不要的文件（merge 后自动删除）
      # ============================================================
      - name: 合并上游到 auto-sync 分支（区域保护）
        id: merge
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          UPSTREAM_SHORT=$(git rev-parse --short=8 upstream/${UPSTREAM_BRANCH})
          BRANCH="auto-sync-${UPSTREAM_SHORT}"
          echo "sync_branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "sync_commit=$UPSTREAM_SHORT" >> $GITHUB_OUTPUT

          # 从最新 main 强制重置分支（可重复运行：已有同名分支则重置）
          git checkout -B "$BRANCH" origin/main

          OURS_FILES=(
            # --- 项目治理/文档（我们自己写的，绝不能被上游覆盖）---
            "README.md"
            "CHANGELOG.md"
            # --- 构建配置（productFlavors 共存变体 / 编译兼容，核心定制）---
            "app/build.gradle"
            "gradle.properties"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/cpp/gladiorenderer/CMakeLists.txt"
            # --- 共存与定制 Java（上游是硬编码/原版，冲突时必须保留我们的）---
            "app/src/main/java/com/winlator/MainApplication.java"
            "app/src/main/java/com/winlator/container/Container.java"
            "app/src/main/java/com/winlator/core/FileUtils.java"
            "app/src/main/java/com/winlator/widget/EnvVarsView.java"
            "app/src/main/java/com/winlator/winhandler/WinHandler.java"
            # --- 中文化补全（上游缺失的中文呈现模式数组）---
            "app/src/main/res/values-zh/arrays.xml"
          )

          # 说明：以下文件刻意【不】保护，跟随上游或走 git 三方自动合并——
          #   core/AppUtils.java、core/PatchUtils.java：与上游逐字节一致（运行时共存）
          #   XServerDisplayActivity.java：仅多一行 mailbox 调优，与上游生命周期重构
          #       位于不同区域，三方合并通常自动保留；锁死反而会漏掉上游前台服务修复
          #   xenvironment/components/VortekRendererComponent.java：已回退上游
          #       （Texture 竞态修复上游已收进 GPUImage.createOrObtain）
          #   ContainerDetailFragment / 各 arrays.xml / xserver_menu.xml /
          #       vortekrenderer/CMakeLists.txt：均已与上游一致
          # 整个目录保护（目录下所有文件冲突时都保留 ours）
          OURS_DIRS=(
            "docs"
            ".github"
            "scripts"
          )
          # 上游有但我们明确不要的文件（merge 后自动删除）
          EXCLUDE_FILES=(
            ".cnb.yml"
          )

          # 判断文件是否属于保护范围（精确匹配 或 目录前缀匹配）
          is_ours() {
            local f="$1" e d
            for e in "${OURS_FILES[@]}"; do [ "$e" = "$f" ] && return 0; done
            for d in "${OURS_DIRS[@]}"; do
              case "$f" in "$d"/*) return 0 ;; esac
            done
            return 1
          }

          # Why: 清洗历史后 main 是孤儿提交，与上游无共同祖先，
          #      普通 git merge 会报 "refusing to merge unrelated histories"（exit 128）。
          #      必须加 --allow-unrelated-histories；合并成功后共同祖先建立，后续正常。
          if git merge upstream/${UPSTREAM_BRANCH} --no-edit --allow-unrelated-histories; then
            echo "=== 上游合并成功（无冲突）==="
          else
            echo "=== merge 有冲突，按区域保护策略逐文件处理 ==="
            git diff --name-only --diff-filter=U | while read f; do
              # 用 stage 3 判断上游版本是否存在（比 theirs: 前缀更可靠）
              if git ls-files -u "$f" | awk '{print $3}' | grep -q '^3$'; then
                if is_ours "$f"; then
                  echo "🛡 保留我们的版本 (ours): $f"
                  git checkout --ours "$f"
                else
                  echo "⬆ 采用上游新版 (theirs): $f"
                  git checkout --theirs "$f"
                fi
              else
                echo "上游删除了该文件，保留我们的版本: $f"
                git checkout --ours "$f" 2>/dev/null || git rm -f "$f" 2>/dev/null || true
              fi
              git add "$f" 2>/dev/null || true
            done
            git commit --no-edit || echo "无变更可提交，跳过"
          fi

          # ===== 保护区域兜底：merge 后强制恢复（防止无冲突自动合入污染）=====
          # Why: 即使没有冲突，上游对 .github/workflows 的改动也会自动合入，
          #      导致 push 被 GitHub 拒绝（GitHub App 不能改 workflow）或覆盖我们的 CI。
          echo "=== 保护区域兜底恢复 ==="
          for d in "${OURS_DIRS[@]}"; do
            # 1) 恢复 ORIG_HEAD 中已有的文件为我们的版本
            git checkout ORIG_HEAD -- "$d" 2>/dev/null && echo "🛡 恢复目录: $d/" || true
            # 2) 删除上游在保护目录新增的文件（兼容已commit/冲突处理中两种状态）
            { git diff --name-only --diff-filter=A ORIG_HEAD HEAD -- "$d/" 2>/dev/null
              git diff --cached --name-only --diff-filter=A -- "$d/" 2>/dev/null
            } | sort -u | while read -r f; do
              [ -n "$f" ] && echo "🗑 丢弃上游新增: $f" && git rm -f "$f" 2>/dev/null || true
            done
          done

          # ===== 删除上游有但我们不要的文件（如 .cnb.yml）=====
          for x in "${EXCLUDE_FILES[@]}"; do
            if [ -f "$x" ] || git ls-files --error-unmatch "$x" >/dev/null 2>&1; then
              echo "🗑 删除排除文件: $x"
              git rm -f "$x" 2>/dev/null || rm -f "$x"
            fi
          done

          git add -A 2>/dev/null || true
          if git diff --cached --quiet 2>/dev/null; then
            echo "保护区域无变化"
          else
            git commit --amend --no-edit 2>/dev/null || git commit --no-edit
            echo "保护区域已恢复 ✓"
          fi

          # ===== 判断与 main 是否有实质差异（无差异则跳过开 PR）=====
          if git diff --quiet origin/main HEAD; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "分支与 main 无差异（上游改动全被保护/排除），不开 PR。"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "分支与 main 有差异，准备开 PR。"
          fi
          echo "=== 分支提交 ==="
          git log --oneline origin/main..HEAD | head -10

      - name: 推送 auto-sync 分支
        if: steps.check.outputs.up_to_date == 'false' && steps.merge.outputs.has_changes == 'true'
        run: |
          BRANCH="${{ steps.merge.outputs.sync_branch }}"
          git push --force origin "$BRANCH" 2>&1 | tail -3 || {
            echo "::error::推送分支失败"
            exit 1
          }
          echo "已推送分支: $BRANCH"

      - name: 创建/更新 PR 到 main
        if: steps.check.outputs.up_to_date == 'false' && steps.merge.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.merge.outputs.sync_branch }}"
          COMMIT="${{ steps.merge.outputs.sync_commit }}"
          # 上游更新摘要（最近 10 条）
          UPSTREAM_LOG=$(git log origin/main..HEAD --oneline --grep="Merge upstream" -1 2>/dev/null | head -1)
          UPSTREAM_MSG=$(git log upstream/${UPSTREAM_BRANCH} --oneline -10 2>/dev/null | sed 's/^/  /')
          BODY="## 自动同步上游 hostei33/winlator-cn（$COMMIT）
          
          此 PR 由定时工作流自动创建。
          
          ### 说明
          - 上游更新已按【区域保护策略】合并：共存/构建定制文件保留我们的版本，其余采用上游新版
          - 此 PR 会自动触发 build-coexist.yml 构建验证（见 Checks）
          - **构建绿色后再合并**；红色说明上游改动与定制有冲突，不要合并，等待修复补丁
          
          ### 上游最近提交
          \`\`\`
          $UPSTREAM_MSG
          \`\`\`
          
          ### 冲突处理
          - 🛡 保留我们的版本（ours）：README、build.gradle、AndroidManifest、FileUtils、WinHandler、Container、EnvVarsView、MainApplication、gladiorenderer CMake 等
          - ⬆ 采用上游新版（theirs）：未被保护的文件
          - 合并后若需验证 APK，打 \`v*\` tag 触发发布（或直接安装 PR 构建产物）
          "
          # 检查是否已有同分支的 open PR
          EXIST=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$EXIST" ]; then
            echo "已有 PR #$EXIST，更新其描述"
            gh pr edit "$EXIST" --title "sync: 同步上游 $COMMIT（自动生成，构建通过后合并）" --body "$BODY"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "sync: 同步上游 $COMMIT（自动生成，构建通过后合并）" \
              --body "$BODY"
          fi
          echo "PR 就绪 ✓（手机端打开 PR 页面，等 Checks 变绿后 Merge）"

      - name: 无更新时提示
        if: steps.check.outputs.up_to_date == 'true'
        run: echo "上游已是最新，无需同步。如需强制同步，请在手动运行时勾选 force_sync。"
