name: 同步上游并自动构建发布

# ============================================================
# 全自动单工作流：合并上游 → 保护定制文件 → 构建 APK → 自检 → 发布 Release
#   - 每天 UTC 18:00 自动运行（北京时间次日 02:00）
#   - 可手动 Run workflow（可选"强制构建"输入）
#   - 上游或 win-fg 有更新时 → 构建并自动发布
#   - 无更新时 → 仅提示，不浪费构建
#
# 注意：本 workflow 不再调用 API 触发 build-coexist.yml（GITHUB_TOKEN
#       无法触发同仓库 workflow_dispatch，会 401），构建发布全部在此完成。
#       build-coexist.yml 保留用于：PR 编译验证 / push main 编译验证 / 手动 push tag 发布。
# ============================================================
on:
  schedule:
    - cron: '0 18 * * *'   # 每天 UTC 18:00 = 北京时间次日 02:00
  workflow_dispatch:
    inputs:
      force_build:
        description: '强制构建并发布（即使上游无更新）'
        type: boolean
        default: false

# 并发锁：同一时间只允许一个运行，避免重复合并/重复构建
concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  NDK_VERSION: '24.0.8215888'
  UPSTREAM_REPO: 'hostei33/winlator-cn'
  UPSTREAM_BRANCH: 'main'

permissions:
  contents: write

jobs:
  sync-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0   # 需要完整历史才能 merge

      - name: 配置 git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: 添加上游并拉取
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}" 2>&1 | tail -3
          echo "=== 上游最新提交 ==="
          git log upstream/${UPSTREAM_BRANCH} --oneline -1

      - name: 检查上游是否有新提交
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/${UPSTREAM_BRANCH})
          echo "本地: ${LOCAL:0:10}  上游: ${UPSTREAM:0:10}"
          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "up_to_date=true" >> $GITHUB_OUTPUT
            echo "上游无新提交，跳过合并。"
          else
            echo "up_to_date=false" >> $GITHUB_OUTPUT
            echo "上游有新提交，开始合并。"
          fi

      # ============================================================
      # 【区域保护策略】冲突时以下文件/目录永远保留我们的版本
      #   OURS_FILES = 精确文件路径（新增定制文件时加这里）
      #   OURS_DIRS  = 整个目录保护（目录下任何文件冲突都保留 ours）
      #   EXCLUDE    = 上游有但我们不要的文件（merge 后自动删除）
      # ============================================================
      - name: 合并上游（区域保护）
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          git checkout main

          OURS_FILES=(
            # --- 项目治理/文档（我们自己写的，绝不能被上游覆盖）---
            "README.md"
            "CHANGELOG.md"
            "coexist.properties"
            # --- 构建配置（共存版定制）---
            "app/build.gradle"
            "gradle.properties"
            "app/src/main/AndroidManifest.xml"
            # --- 共存核心 Java 源码 ---
            "app/src/main/java/com/winlator/container/Container.java"
            "app/src/main/java/com/winlator/core/AppUtils.java"
            "app/src/main/java/com/winlator/core/FileUtils.java"
            "app/src/main/java/com/winlator/core/LogCaptureHelper.java"
            "app/src/main/java/com/winlator/core/WinFGConfig.java"
            "app/src/main/java/com/winlator/widget/EnvVarsView.java"
            "app/src/main/java/com/winlator/winhandler/WinHandler.java"
            "app/src/main/java/com/winlator/ContainerDetailFragment.java"
            # --- win-fg UI 资源 ---
            "app/src/main/res/layout/container_detail_fragment.xml"
            "app/src/main/res/values/arrays.xml"
            "app/src/main/res/values-zh/arrays.xml"
            # --- native 共存改动 ---
            "app/src/main/cpp/gladiorenderer/CMakeLists.txt"
            # --- win-fg native 帧生成集成 ---
            "app/src/main/cpp/vortekrenderer/CMakeLists.txt"
            "app/src/main/cpp/vortekrenderer/src/main.c"
            "app/src/main/cpp/vortekrenderer/src/xwindow_swapchain.c"
            "app/src/main/cpp/vortekrenderer/include/xwindow_swapchain.h"
            "app/src/main/cpp/vortekrenderer/include/vk_context.h"
            "app/src/main/cpp/vortekrenderer/src/vulkan_helper.c"
            "app/src/main/cpp/vortekrenderer/src/request_handler.c"
            "app/src/main/cpp/winlator/winfg/winfg_bridge.cpp"
            "app/src/main/cpp/winlator/winfg/winfg_bridge.h"
            # --- win-fg 运行时菜单 UI ---
            "app/src/main/java/com/winlator/XServerDisplayActivity.java"
            "app/src/main/java/com/winlator/xenvironment/components/VortekRendererComponent.java"
            "app/src/main/res/menu/xserver_menu.xml"
            # --- win-fg native 集成补丁（仓库根目录） ---
            "winfg-native.patch"
          )
          # 整个目录保护（目录下所有文件冲突时都保留 ours）
          OURS_DIRS=(
            "docs"
            ".github"
            "scripts"
          )
          # 上游有但我们明确不要的文件（merge 后自动删除）
          EXCLUDE_FILES=(
            ".cnb.yml"
          )

          # 判断文件是否属于保护范围（精确匹配 或 目录前缀匹配）
          is_ours() {
            local f="$1" e d
            for e in "${OURS_FILES[@]}"; do [ "$e" = "$f" ] && return 0; done
            for d in "${OURS_DIRS[@]}"; do
              case "$f" in "$d"/*) return 0 ;; esac
            done
            return 1
          }

          # Why: 清洗历史后 main 是孤儿提交，与上游无共同祖先，
          #      普通 git merge 会报 "refusing to merge unrelated histories"（exit 128）。
          #      必须加 --allow-unrelated-histories；合并成功后共同祖先建立，后续正常。
          if git merge upstream/main --no-edit --allow-unrelated-histories; then
            echo "=== 上游合并成功（无冲突）==="
          else
            echo "=== merge 有冲突，按区域保护策略逐文件处理 ==="
            git diff --name-only --diff-filter=U | while read f; do
              # 用 stage 3 判断上游版本是否存在（比 theirs: 前缀更可靠）
              if git ls-files -u "$f" | awk '{print $3}' | grep -q '^3$'; then
                if is_ours "$f"; then
                  echo "🛡 保留我们的版本 (ours): $f"
                  git checkout --ours "$f"
                else
                  echo "⬆ 采用上游新版 (theirs): $f"
                  git checkout --theirs "$f"
                fi
              else
                echo "上游删除了该文件，保留我们的版本: $f"
                git checkout --ours "$f" 2>/dev/null || git rm -f "$f" 2>/dev/null || true
              fi
              git add "$f" 2>/dev/null || true
            done
            git commit --no-edit || echo "无变更可提交，跳过"
          fi

          # ===== 保护区域兜底：merge 后强制恢复（防止无冲突自动合入污染）=====
          # Why: 即使没有冲突，上游对 .github/workflows 的改动也会自动合入，
          #      导致 push 被 GitHub 拒绝（GitHub App 不能改 workflow）或覆盖我们的 CI。
          echo "=== 保护区域兜底恢复 ==="
          for d in "${OURS_DIRS[@]}"; do
            # 1) 恢复 ORIG_HEAD 中已有的文件为我们的版本
            git checkout ORIG_HEAD -- "$d" 2>/dev/null && echo "🛡 恢复目录: $d/" || true
            # 2) 删除上游在保护目录新增的文件（兼容已commit/冲突处理中两种状态）
            { git diff --name-only --diff-filter=A ORIG_HEAD HEAD -- "$d/" 2>/dev/null
              git diff --cached --name-only --diff-filter=A -- "$d/" 2>/dev/null
            } | sort -u | while read -r f; do
              [ -n "$f" ] && echo "🗑 丢弃上游新增: $f" && git rm -f "$f" 2>/dev/null || true
            done
          done

          # ===== 删除上游有但我们不要的文件（如 .cnb.yml）=====
          for x in "${EXCLUDE_FILES[@]}"; do
            if [ -f "$x" ] || git ls-files --error-unmatch "$x" >/dev/null 2>&1; then
              echo "🗑 删除排除文件: $x"
              git rm -f "$x" 2>/dev/null || rm -f "$x"
            fi
          done

          git add -A 2>/dev/null || true
          if git diff --cached --quiet 2>/dev/null; then
            echo "保护区域无变化"
          else
            git commit --amend --no-edit 2>/dev/null || git commit --no-edit
            echo "保护区域已恢复 ✓"
          fi
          git log --oneline -5

      # ===== win-fg 帧生成引擎上游跟踪（native 源码模式）=====
      - name: 检测 win-fg 上游版本
        id: winfg-check
        run: |
          # native 集成用源码而非 release .so，跟踪上游 main 分支 commit
          WINFG_LATEST=$(git ls-remote https://github.com/The412Banner/win-fg.git master 2>/dev/null | awk '{print substr($1,1,12)}')
          echo "win-fg 上游 commit: ${WINFG_LATEST:-unknown}"
          WINFG_STORED=""
          if [ -f .winfg-version ]; then
            WINFG_STORED=$(cat .winfg-version | tr -d '[:space:]')
          fi
          echo "仓库记录版本: ${WINFG_STORED:-（无记录）}"
          if [ "$WINFG_LATEST" != "$WINFG_STORED" ] && [ -n "$WINFG_LATEST" ]; then
            echo "has_update=true" >> $GITHUB_OUTPUT
            echo "winfg_version=$WINFG_LATEST" >> $GITHUB_OUTPUT
            echo "win-fg 有新 commit $WINFG_LATEST。"
          else
            echo "has_update=false" >> $GITHUB_OUTPUT
            echo "win-fg 已是最新（${WINFG_LATEST:-unknown}）。"
          fi

      # ===== 判断是否需要构建 =====
      - name: 判断是否需要构建发布
        id: need
        run: |
          NEED="false"
          [ "${{ steps.check.outputs.up_to_date }}" = "false" ] && NEED="true"
          [ "${{ steps.winfg-check.outputs.has_update }}" = "true" ] && NEED="true"
          [ "${{ github.event.inputs.force_build }}" = "true" ] && NEED="true"
          echo "need_build=$NEED" >> $GITHUB_OUTPUT
          if [ "$NEED" = "true" ]; then
            echo "→ 需要构建发布"
          else
            echo "→ 无需构建"
          fi

      # ===== 推送合并结果（含 non-fast-forward 自动处理）=====
      - name: 推送合并结果
        if: steps.need.outputs.need_build == 'true' && steps.check.outputs.up_to_date == 'false'
        run: |
          echo "=== 推送前诊断 ==="
          git log --oneline -3
          git fetch origin main 2>&1 || echo "(fetch origin 失败)"
          LOCAL_HEAD=$(git rev-parse HEAD)
          REMOTE_HEAD=$(git rev-parse origin/main 2>/dev/null || echo "unknown")
          echo "本地 HEAD:  ${LOCAL_HEAD:0:10}"
          echo "远程 main: ${REMOTE_HEAD:0:10}"

          # Why: 用户可能在 workflow 运行期间手动改了 main（网页直接编辑/上传），
          #      导致 CI 的本地提交落后于远程 → push 报 non-fast-forward。
          if [ "$REMOTE_HEAD" != "unknown" ] && [ "$LOCAL_HEAD" != "$REMOTE_HEAD" ]; then
            if git merge-base --is-ancestor origin/main HEAD 2>/dev/null; then
              echo "本地领先远程（可 fast-forward），直接 push"
            else
              echo "::warning::检测到远程 main 有本地没有的新提交（可能你手动改过 main），先 rebase 再 push"
              git pull --rebase origin main 2>&1 || {
                echo "::error::rebase 失败（远程改动与本地冲突），已中止，请人工处理"
                git rebase --abort 2>/dev/null || true
                exit 1
              }
              echo "rebase 完成，最新提交:"
              git log --oneline -3
            fi
          fi

          echo "=== 执行 git push origin main ==="
          PUSH_OUT=$(git push origin main 2>&1) && {
            echo "$PUSH_OUT"
            echo "推送成功 ✓"
          } || {
            echo "$PUSH_OUT"
            echo "::error::========== git push 原始错误 =========="
            echo "$PUSH_OUT" | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
            echo "::error::======================================"
            echo "::error::排查：hint: Updates were rejected（non-fast-forward）→ 已自动 rebase 处理；"
            echo "::error::排查：403/denied → 分支保护未删干净（Settings→Branches）或 Workflow permissions 不是 Read and write；"
            echo "::error::排查：401/Authentication failed → GITHUB_TOKEN 无效"
            exit 1
          }

      # ===== 更新 win-fg 版本记录 =====
      - name: 更新 win-fg 版本记录
        if: steps.need.outputs.need_build == 'true' && steps.winfg-check.outputs.has_update == 'true'
        run: |
          echo "${{ steps.winfg-check.outputs.winfg_version }}" > .winfg-version
          git add .winfg-version
          git commit -m "chore: bump win-fg to ${{ steps.winfg-check.outputs.winfg_version }} (auto-detected upstream release)"
          git fetch origin main 2>&1 || true
          if ! git merge-base --is-ancestor origin/main HEAD 2>/dev/null; then
            echo "远程 main 有新提交，先 rebase"
            git pull --rebase origin main 2>&1 || { echo "::error::rebase 失败"; git rebase --abort 2>/dev/null || true; exit 1; }
          fi
          git push origin main 2>&1 || { echo "::error::push 失败（见上）"; exit 1; }
          echo "win-fg 版本记录已更新并推送 ✓"

      # ============================================================
      # ================= 以下为构建 + 发布步骤 ====================
      # ============================================================
      - name: 安装依赖
        if: steps.need.outputs.need_build == 'true'
        run: |
          pip install zstandard
          sudo apt-get update -qq && sudo apt-get install -y -qq aapt apksigner unzip 2>/dev/null || true

      - name: 读取共存配置
        if: steps.need.outputs.need_build == 'true'
        id: config
        run: |
          chmod +x scripts/apply-config.sh
          bash scripts/apply-config.sh coexist.properties app/build.gradle

      - name: 同步 win-fg 上游源码（native 帧生成引擎，MIT）
        if: steps.need.outputs.need_build == 'true'
        run: |
          # Why: win-fg native 模式把帧生成编译进 host compositor（vortekrenderer），
          #      比 guest Vulkan layer 模式效果好（layer 模式生成帧会被 host 丢弃，仅~25%提升）。
          #      构建时从上游拉取最新源码，自动跟随上游更新。
          # What: 下载 win-fg 核心源码到 app/src/main/cpp/winlator/winfg/，
          #      CMake 编译进 vortekrenderer。
          # How:  删除本步骤即回退到无帧生成版本。
          mkdir -p app/src/main/cpp/winlator/winfg
          WINFG_FILES="framegen.cpp framegen.hpp record_impl.inc config.hpp embedded_shaders.hpp vk_dispatch.hpp log.hpp"
          for f in $WINFG_FILES; do
            curl -fsSL -o "app/src/main/cpp/winlator/winfg/$f" \
              "https://raw.githubusercontent.com/The412Banner/win-fg/master/src/$f" \
              || { echo "::error::win-fg 源码下载失败: $f"; exit 1; }
          done
          # 下载 license 和 attribution
          curl -fsSL -o app/src/main/cpp/winlator/winfg/LICENSE.win-fg \
            "https://raw.githubusercontent.com/The412Banner/win-fg/master/LICENSE" || true
          curl -fsSL -o app/src/main/cpp/winlator/winfg/NOTICE_FIDELITYFX_OPTICALFLOW.md \
            "https://raw.githubusercontent.com/The412Banner/win-fg/master/NOTICE_FIDELITYFX_OPTICALFLOW.md" || true
          ls -lh app/src/main/cpp/winlator/winfg/
          test -s app/src/main/cpp/winlator/winfg/framegen.cpp || { echo "::error::framegen.cpp 为空"; exit 1; }
          echo "WINFG_VERSION=${{ steps.winfg-check.outputs.winfg_version }}" >> $GITHUB_ENV
          echo "win-fg 源码版本: ${{ steps.winfg-check.outputs.winfg_version }}"

      # ===== 应用 win-fg native 集成补丁 =====
      # Why: 15 个 native/Java/UI 文件改动合并为一个 patch（winfg-native.patch，仓库根目录），
      #      CI 构建时自动应用，避免在 GitHub 网页端逐个上传深层文件。
      # What: git apply 应用到 merge 上游后的工作树；失败则明确报错退出（不静默）。
      # How:  上游更新导致 patch 冲突时，用 scripts/rebuild-winfg-patch.sh 重建 patch。
      - name: 应用 win-fg native 集成补丁
        if: steps.need.outputs.need_build == 'true'
        run: |
          test -f winfg-native.patch || { echo "::error::winfg-native.patch 不存在（请在仓库根目录上传）"; exit 1; }
          git apply --check --verbose winfg-native.patch 2>&1 | tail -3 || true
          if ! git apply --check winfg-native.patch 2>/dev/null; then
            echo "::error::winfg-native.patch 应用检查失败（可能上游更新了相关文件）"
            echo "请更新 patch：本地 git apply --3way 或重建 winfg-native.patch 后重新上传"
            exit 1
          fi
          git apply winfg-native.patch
          echo "win-fg native 补丁已应用 ✓"
          ls -la app/src/main/cpp/winlator/winfg/winfg_bridge.cpp

      - name: 对 assets 做等长包名替换
        if: steps.need.outputs.need_build == 'true'
        run: |
          python3 scripts/patch-assets.py --config coexist.properties --assets-dir app/src/main/assets

      - name: 诊断：确认 assets 未丢失
        if: steps.need.outputs.need_build == 'true'
        run: |
          echo "=== assets 目录大小 ==="
          du -sh app/src/main/assets/
          echo "=== rootfs.tzst ==="
          ls -lh app/src/main/assets/rootfs.tzst
          echo "=== win-fg 帧生成引擎 ==="
          ls -lh app/src/main/assets/winfg/
          echo "=== build.gradle 关键行 ==="
          grep -E "applicationId|versionCode|versionName" app/build.gradle

      - name: 校验 gradle.properties
        if: steps.need.outputs.need_build == 'true'
        run: |
          cat gradle.properties
          grep -nE 'falseorg|trueorg|falsetrue' gradle.properties && { echo "::error::gradle.properties 属性粘连"; exit 1; } || true

      - name: Set up JDK
        if: steps.need.outputs.need_build == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        if: steps.need.outputs.need_build == 'true'
        uses: android-actions/setup-android@v3

      - name: 安装 NDK 和 CMake
        if: steps.need.outputs.need_build == 'true'
        run: sdkmanager --install "ndk;${{ env.NDK_VERSION }}" "cmake;3.22.1"

      - name: 准备签名 keystore
        if: steps.need.outputs.need_build == 'true'
        id: keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "使用自定义签名"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > custom.keystore
            echo "keystore_path=$PWD/custom.keystore" >> $GITHUB_OUTPUT
            echo "keystore_pass=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_OUTPUT
            echo "key_alias=${{ secrets.KEY_ALIAS }}" >> $GITHUB_OUTPUT
            echo "key_pass=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_OUTPUT
          else
            echo "使用 debug 签名"
            keytool -genkey -v -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US"
            echo "keystore_path=$PWD/debug.keystore" >> $GITHUB_OUTPUT
            echo "keystore_pass=android" >> $GITHUB_OUTPUT
            echo "key_alias=androiddebugkey" >> $GITHUB_OUTPUT
            echo "key_pass=android" >> $GITHUB_OUTPUT
          fi

      - name: 构建 Release APK
        if: steps.need.outputs.need_build == 'true'
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=${{ steps.keystore.outputs.keystore_path }} \
            -Pandroid.injected.signing.store.password=${{ steps.keystore.outputs.keystore_pass }} \
            -Pandroid.injected.signing.key.alias=${{ steps.keystore.outputs.key_alias }} \
            -Pandroid.injected.signing.key.password=${{ steps.keystore.outputs.key_pass }} > build.log 2>&1
          GRADLE_EXIT=$?
          echo "Gradle 退出码: $GRADLE_EXIT"
          grep -nE "^e: |error:|FAILED|FAILURE:|What went wrong|> Task .*FAILED|Caused by:|Execution failed|ninja: error|clang.*error" build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "========== 最后 80 行 =========="
          tail -80 build.log
          if [ $GRADLE_EXIT -ne 0 ]; then
            echo "::error::Gradle 构建失败，退出码 $GRADLE_EXIT"
            exit 1
          fi

      - name: 确认 APK
        if: steps.need.outputs.need_build == 'true'
        run: |
          ls -lh app/build/outputs/apk/release/
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      - name: 重命名 APK
        if: steps.need.outputs.need_build == 'true'
        run: |
          SHA=$(git rev-parse --short HEAD)
          TS=$(date +%Y%m%d-%H%M%S)
          mv "$APK_PATH" "Winlator-coexist-${SHA}-${TS}.apk"
          ls -lh *.apk
          echo "APK_FINAL=$(ls *.apk | head -1)" >> $GITHUB_ENV

      - name: 发布前静态自检
        if: steps.need.outputs.need_build == 'true'
        run: |
          chmod +x scripts/pre-release-check.sh
          bash scripts/pre-release-check.sh "$APK_FINAL" "${{ env.APP_ID }}"

      - name: 生成更新日志
        if: steps.need.outputs.need_build == 'true'
        run: |
          chmod +x scripts/generate-changelog.sh
          bash scripts/generate-changelog.sh RELEASE_NOTES.md "${{ env.APP_ID }}"

      - name: 上传 APK（artifact）
        if: steps.need.outputs.need_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: winlator-coexist-apk
          path: "*.apk"
          retention-days: 30

      # ===== 打 tag（构建成功后，失败不产生孤儿 tag）=====
      - name: 打 tag 并推送
        if: steps.need.outputs.need_build == 'true'
        id: tag
        run: |
          VER=$(grep -oE 'versionName "[^"]+"' app/build.gradle 2>/dev/null | head -1 | sed 's/.*"\(.*\)"/\1/')
          [ -z "$VER" ] || [ "$VER" = "__VERSION_NAME__" ] && VER="11.2.cn.03"
          WFG=$(cat .winfg-version 2>/dev/null || echo "v0.3.0")
          TS=$(date +%Y%m%d-%H%M)
          TAG="v${VER}-coexist-winfg-${WFG}-${TS}"
          # 同 tag 已存在则追加秒数（防冲突）
          if git ls-remote --tags origin "$TAG" 2>/dev/null | grep -q "$TAG"; then
            TAG="${TAG}-$(date +%S)"
          fi
          git tag "$TAG"
          TAG_OUT=$(git push origin "$TAG" 2>&1) && {
            echo "$TAG_OUT"
            echo "已打 tag: $TAG"
          } || {
            echo "$TAG_OUT"
            echo "::error::推送 tag 失败："
            echo "$TAG_OUT" | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
            exit 1
          }
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT

      # ===== 发布 Release =====
      - name: 发布 Release
        if: steps.need.outputs.need_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
          name: "Winlator 共存版 ${{ env.VERSION_NAME }} (${{ env.APP_ID }}) + win-fg ${{ env.WINFG_VERSION }}"
          tag_name: ${{ steps.tag.outputs.tag_name }}
          draft: false
          # 自检全过无警告 → 正式版（自动 Latest）；有跳过项 → pre-release（需人工验证）
          prerelease: ${{ env.SELF_CHECK_NEED_MANUAL == '1' }}
          body_path: RELEASE_NOTES.md
          make_latest: ${{ env.SELF_CHECK_NEED_MANUAL == '0' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 无更新时提示
        if: steps.need.outputs.need_build == 'false'
        run: echo "上游与 win-fg 均已是最新，无需构建发布。如需强制构建，请在手动运行时勾选 force_build。"
