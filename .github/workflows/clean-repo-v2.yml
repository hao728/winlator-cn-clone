# ============================================================
# 仓库清洗 v2（基于 bfm-zh 已验证方案）
# 关键差异：用 git reset --soft <根提交> 而非 checkout --orphan
#   squash 提交有 parent（上游根提交），force push 不会被 GitHub 拒绝
# 跑完后本文件已从提交中排除，不会出现在最终历史
# 回滚：网页端新建分支指向 tag pre-clean-backup 即可恢复
# ============================================================
name: 仓库清洗 v2

on:
  workflow_dispatch:

concurrency:
  group: clean-repo-v2
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  squash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 完整历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ===== 1. 备份 tag：清洗前完整历史永久锚点 =====
      - name: 打备份 tag
        run: |
          git tag -f pre-clean-backup
          git push -f origin pre-clean-backup
          echo "✅ 备份 tag pre-clean-backup 已创建"

      # ===== 2. 清理残留工作流 + 升级 actions + 消除重复发布 =====
      - name: 清理工作流文件
        run: |
          # 删除残留调试工作流
          rm -f .github/workflows/android-ci.yml
          rm -f .github/workflows/build-native.yml
          # 自我删除（本工作流完成使命，不留在最终历史）
          rm -f .github/workflows/clean-repo.yml
          rm -f .github/workflows/clean-repo-v2.yml
          # 升级 setup-java v4 → v5
          sed -i 's|actions/setup-java@v4|actions/setup-java@v5|' .github/workflows/build-coexist.yml .github/workflows/sync-upstream.yml
          # 消除重复发布：build-coexist 去掉 tags 触发（发布统一走 sync-upstream）
          sed -i "/tags: \['v\*'\]/d" .github/workflows/build-coexist.yml
          echo "=== 清理后工作流列表 ==="
          ls .github/workflows/
          echo "=== build-coexist 触发规则 ==="
          sed -n '/^on:/,/^env:/p' .github/workflows/build-coexist.yml

      # ===== 3. Squash 历史（bfm-zh 验证方案：reset --soft 到根提交）=====
      - name: Squash 全部历史
        run: |
          FIRST=$(git rev-list --max-parents=0 HEAD | head -1)
          echo "根提交: $FIRST"
          echo "清洗前提交数: $(git rev-list --count HEAD)"
          # 软重置到根提交：HEAD 移到根提交，index 和工作树保持不变
          git reset --soft "$FIRST"
          git add -A
          git commit \
            -m "feat: winlator-cn 共存定制版" \
            -m "- 包名共存：Manifest/Java/assets 三层一致化 + 12 字符等长替换，可与原版 com.winlator 共存" \
            -m "- win-fg 帧生成：native 集成（编译进 vortekrenderer compositor），自动跟随上游源码" \
            -m "- 全自动 CI：每日同步上游 + 区域保护 + 构建 + 静态自检 + Release 发布" \
            -m "- 中文界面与文档"
          echo "清洗后提交数: $(git rev-list --count HEAD)"
          git log --oneline

      # ===== 4. Force push =====
      - name: 强制推送 main
        run: |
          git push --force origin main && echo "✅ 清洗完成，main 已更新" || {
            echo "::error::force push 失败"
            echo "::error::恢复方法：网页端新建分支指向 pre-clean-backup tag"
            exit 1
          }

      - name: 结果汇总
        run: |
          echo "=============================================="
          echo "✅ 清洗完成"
          echo "  备份 tag: pre-clean-backup（完整历史锚点，勿删）"
          echo "  残留工作流: 已删除 android-ci / build-native"
          echo "  actions: setup-java 已升级 v5"
          echo "  重复发布: build-coexist 不再响应 tag"
          echo "  历史: 已 squash（根提交 + 1 个定制提交）"
          echo "=============================================="
