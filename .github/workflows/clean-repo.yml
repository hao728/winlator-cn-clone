# ============================================================
# 仓库清洗 v5（最终版：squash 提交零 workflow 变更）
# 原理：GitHub 无 workflows 权限时允许"新增"workflow 文件，
#       但拒绝"修改已有"。本工作流把 .github/workflows/ 恢复为
#       根提交版本，squash 提交相对根提交无任何 workflow 变更
#       → 用 GITHUB_TOKEN 即可 force push，无需 PAT
# 跑完后本文件不在最终历史（被恢复步骤排除）
# 回滚：网页端新建分支指向 tag pre-clean-backup
# ============================================================
name: 仓库清洗 v5

on:
  workflow_dispatch:

concurrency:
  group: clean-repo-v5
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  squash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 完整历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ===== 1. 备份 tag =====
      - name: 打备份 tag
        run: |
          git tag -f pre-clean-backup
          git push --force origin pre-clean-backup
          echo "✅ 备份 tag pre-clean-backup 已创建"

      # ===== 2. Squash（workflow 恢复为根提交版本，零变更）=====
      - name: Squash 历史（workflow 保持根提交版本）
        run: |
          set -e
          FIRST=$(git rev-list --max-parents=0 HEAD | head -1)
          test -n "$FIRST" || { echo "::error::无法确定根提交"; exit 1; }
          echo "根提交: $FIRST"
          echo "清洗前提交数: $(git rev-list --count HEAD)"
          echo "清洗前 workflow 文件:"
          ls .github/workflows/

          # 关键：物理删除工作树中的 workflow 目录，再从根提交恢复
          rm -rf .github/workflows
          git checkout "$FIRST" -- .github/workflows/

          # 验证：index 中 workflow 与根提交完全一致
          if git diff --cached --quiet "$FIRST" -- .github/workflows/; then
            echo "✓ workflow 已恢复为根提交版本"
          else
            echo "::error::workflow 恢复失败，仍有差异："
            git diff --cached --name-only "$FIRST" -- .github/workflows/
            exit 1
          fi
          echo "恢复后 workflow 文件:"
          ls .github/workflows/

          # Squash
          git reset --soft "$FIRST"
          git add -A
          git commit \
            -m "feat: winlator-cn 共存定制版" \
            -m "- 包名共存：Manifest/Java/assets 三层一致化 + 12 字符等长替换，可与原版 com.winlator 共存" \
            -m "- win-fg 帧生成：native 集成（编译进 vortekrenderer compositor），自动跟随上游源码" \
            -m "- 全自动 CI：每日同步上游 + 区域保护 + 构建 + 静态自检 + Release 发布" \
            -m "- 中文界面与文档"

          # 最终验证：squash 提交相对根提交无 workflow 变更
          if git diff --quiet "$FIRST" HEAD -- .github/workflows/; then
            echo "✓ squash 提交无 workflow 变更（force push 安全）"
          else
            echo "::error::squash 提交包含 workflow 变更："
            git diff --name-only "$FIRST" HEAD -- .github/workflows/
            exit 1
          fi
          echo "清洗后提交数: $(git rev-list --count HEAD)"
          git log --oneline

      # ===== 3. Force push（GITHUB_TOKEN 即可）=====
      - name: 强制推送 main
        run: |
          set +e
          PUSH_OUT=$(git push --force origin main 2>&1)
          PUSH_CODE=$?
          echo "=== git push 输出 ==="
          echo "$PUSH_OUT"
          if [ $PUSH_CODE -ne 0 ]; then
            echo "::error::force push 失败：$PUSH_OUT"
            echo "::error::恢复方法：网页端新建分支指向 pre-clean-backup tag"
            exit 1
          fi
          echo "✅ 清洗完成，main 已更新"

      - name: 结果汇总
        run: |
          echo "=============================================="
          echo "✅ Squash 完成"
          echo "  备份 tag: pre-clean-backup（完整历史锚点，勿删）"
          echo "  历史: 根提交 + 1 个定制提交"
          echo ""
          echo "⚠️  下一步（用户手动，网页端，约 5 分钟）："
          echo "  1. 删除 .github/workflows/android-ci.yml"
          echo "  2. 删除 .github/workflows/build-native.yml"
          echo "  3. 删除 .github/workflows/clean-repo-v5.yml"
          echo "  4. 用改好的 build-coexist.yml 和 sync-upstream.yml 覆盖上传"
          echo "     （改好的文件在 winlator-workflow-fix.zip 中）"
          echo "=============================================="
