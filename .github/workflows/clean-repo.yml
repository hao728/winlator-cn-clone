# ============================================================
# 仓库清洗 v4（用 PAT_TOKEN force push，一次性完成）
# PAT 需具备 repo + workflow scope
# 跑完后本文件已从提交中排除
# 回滚：网页端新建分支指向 tag pre-clean-backup
# ============================================================
name: 仓库清洗 v4

on:
  workflow_dispatch:

concurrency:
  group: clean-repo-v4
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  squash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 完整历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 git 与 PAT
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 用 PAT 配置 remote（PAT 有 repo + workflow scope，可 force push + 改 workflow）
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          # 验证 PAT 有效性
          git ls-remote origin main > /dev/null && echo "✅ PAT 认证有效" || {
            echo "::error::PAT_TOKEN 无效或权限不足，请确认 PAT 有 repo scope（改 workflow 还需 workflow scope）"
            exit 1
          }

      # ===== 1. 备份 tag =====
      - name: 打备份 tag
        run: |
          git tag -f pre-clean-backup
          git push -f origin pre-clean-backup
          echo "✅ 备份 tag pre-clean-backup 已创建"

      # ===== 2. 清理残留工作流 + 升级 actions + 消除重复发布 =====
      - name: 清理工作流文件
        run: |
          # 删除残留调试工作流
          rm -f .github/workflows/android-ci.yml
          rm -f .github/workflows/build-native.yml
          # 自我删除（本工作流完成使命）
          rm -f .github/workflows/clean-repo.yml
          rm -f .github/workflows/clean-repo-v2.yml
          rm -f .github/workflows/clean-repo-v3.yml
          rm -f .github/workflows/clean-repo-v4.yml
          # 升级 setup-java v4 → v5
          sed -i 's|actions/setup-java@v4|actions/setup-java@v5|' .github/workflows/build-coexist.yml .github/workflows/sync-upstream.yml
          # 消除重复发布：build-coexist 去掉 tags 触发
          sed -i "/tags: \['v\*'\]/d" .github/workflows/build-coexist.yml
          echo "=== 清理后工作流列表 ==="
          ls .github/workflows/

      # ===== 3. Squash 历史（bfm-zh 验证方案）=====
      - name: Squash 全部历史
        run: |
          FIRST=$(git rev-list --max-parents=0 HEAD | head -1)
          echo "根提交: $FIRST"
          echo "清洗前提交数: $(git rev-list --count HEAD)"
          git reset --soft "$FIRST"
          git add -A
          git commit \
            -m "feat: winlator-cn 共存定制版" \
            -m "- 包名共存：Manifest/Java/assets 三层一致化 + 12 字符等长替换，可与原版 com.winlator 共存" \
            -m "- win-fg 帧生成：native 集成（编译进 vortekrenderer compositor），自动跟随上游源码" \
            -m "- 全自动 CI：每日同步上游 + 区域保护 + 构建 + 静态自检 + Release 发布" \
            -m "- 中文界面与文档"
          echo "清洗后提交数: $(git rev-list --count HEAD)"
          git log --oneline

      # ===== 4. Force push（用 PAT）=====
      - name: 强制推送 main
        run: |
          set +e
          PUSH_OUT=$(git push --force origin main 2>&1)
          PUSH_CODE=$?
          echo "=== git push 输出 ==="
          echo "$PUSH_OUT"
          if [ $PUSH_CODE -ne 0 ]; then
            echo "::error::force push 失败，exit code=$PUSH_CODE"
            echo "::error::真实错误: $PUSH_OUT"
            echo "::error::请确认 PAT_TOKEN 有 repo + workflow scope，且未过期"
            echo "::error::恢复方法：网页端新建分支指向 pre-clean-backup tag"
            exit 1
          fi
          echo "✅ 清洗完成，main 已更新"

      - name: 结果汇总
        run: |
          echo "=============================================="
          echo "✅ 清洗全部完成"
          echo "  备份 tag: pre-clean-backup（完整历史锚点，勿删）"
          echo "  残留工作流: 已删除 android-ci / build-native"
          echo "  actions: setup-java 已升级 v5"
          echo "  重复发布: build-coexist 不再响应 tag"
          echo "  历史: 已 squash（根提交 + 1 个定制提交）"
          echo "  清洗工作流: 已自我删除"
          echo "=============================================="
