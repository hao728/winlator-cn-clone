# ============================================================
# 仓库清洗（一次性工作流）
# 用途：手机网页端一键完成仓库治理，无需本地 git 操作
#   1. 打备份 tag pre-clean-backup（完整历史永久保留，可随时恢复）
#   2. 删除残留调试工作流（android-ci.yml / build-native.yml）
#   3. 升级 actions 版本（setup-java v4 → v5，消除弃用警告）
#   4. 消除重复发布（build-coexist.yml 去掉 tags 触发，发布统一走 sync-upstream）
#   5. Squash 全部历史为单个语义化提交
#   6. Force push 到 main
# 跑完后本文件已被 squash 排除，不会出现在最终历史中
# 回滚方法：网页端新建分支指向 tag pre-clean-backup 即可恢复清洗前完整状态
# ============================================================
name: 仓库清洗（一次性）

on:
  workflow_dispatch:

concurrency:
  group: clean-repo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 完整历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 必须完整历史才能 squash

      - name: 配置 git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      # ===== 1. 备份 tag：清洗前完整历史永久锚点 =====
      - name: 打备份 tag
        run: |
          git fetch origin main
          git checkout main
          git tag -f pre-clean-backup
          git push -f origin pre-clean-backup && echo "✅ 备份 tag 已创建: pre-clean-backup" || echo "::warning::备份 tag 推送失败，请检查权限"

      # ===== 2. 删除残留调试工作流 =====
      - name: 删除残留工作流
        run: |
          rm -f .github/workflows/android-ci.yml
          rm -f .github/workflows/build-native.yml
          echo "已删除: android-ci.yml build-native.yml"
          ls .github/workflows/

      # ===== 3. 升级 actions 版本（setup-java v4 → v5）=====
      - name: 升级 Actions 版本
        run: |
          sed -i 's|actions/setup-java@v4|actions/setup-java@v5|' .github/workflows/build-coexist.yml .github/workflows/sync-upstream.yml
          echo "setup-java 引用："
          grep -rn "setup-java@" .github/workflows/ || echo "（无）"

      # ===== 4. 消除重复发布 =====
      # Why: sync-upstream 自动打 v* tag 会触发 build-coexist 的 tags 触发，
      #      同一构建发布跑两次、产生重复 Release。发布统一由 sync-upstream 完成。
      # What: 仅删除 build-coexist.yml 中 on.push.tags 触发行，保留 branches/PR/手动触发。
      # How:  恢复该行即回滚；需要手动发布时用 sync-upstream 手动运行并勾选 force_build。
      - name: 消除重复发布
        run: |
          python3 << 'PYEOF'
          path = '.github/workflows/build-coexist.yml'
          with open(path) as f:
              lines = f.readlines()
          out = []
          removed = False
          for line in lines:
              if line.strip() == "tags: ['v*']":
                  removed = True
                  continue
              out.append(line)
          with open(path, 'w') as f:
              f.writelines(out)
          print("已删除 tags 触发" if removed else "⚠️ 未找到 tags 行（可能已删）")
          PYEOF

      # ===== 5. 校验：确认 build-coexist 仍保留 push 触发 =====
      - name: 校验工作流完整性
        run: |
          echo "=== build-coexist 触发规则 ==="
          sed -n '/^on:/,/^env:/p' .github/workflows/build-coexist.yml | head -20
          test -f .github/workflows/build-coexist.yml && test -f .github/workflows/sync-upstream.yml && echo "✅ 核心工作流存在"

      # ===== 6. Squash 全部历史 =====
      # 本文件（clean-repo.yml）先自我删除，确保不出现在最终历史
      - name: Squash 历史为单提交
        run: |
          rm -f .github/workflows/clean-repo.yml
          git checkout --orphan clean-main
          git add -A
          git commit \
            -m "feat: winlator-cn 共存定制版初始版本" \
            -m "- 包名共存：Manifest/Java/assets 三层一致化 + 12 字符等长替换，可与原版 com.winlator 共存" \
            -m "- win-fg 帧生成：native 集成（编译进 vortekrenderer compositor），自动跟随上游源码" \
            -m "- 全自动 CI：每日同步上游 + 区域保护 + 构建 + 静态自检 + Release 发布" \
            -m "- 中文界面与文档"
          git branch -M clean-main main
          echo "squash 完成，提交数:"
          git rev-list --count HEAD

      # ===== 7. Force push 到 main =====
      - name: 强制推送 main
        run: |
          PUSH_OUT=$(git push -f origin main 2>&1) && {
            echo "$PUSH_OUT"
            echo "✅ 清洗完成！历史已 squash 为单提交，main 已更新"
          } || {
            echo "$PUSH_OUT"
            echo "::error::force push 失败（常见原因：分支保护规则阻止 force push）"
            echo "::error::解决：手机浏览器打开仓库 Settings → Branches → 删除 main 的保护规则（若存在）后重新 Run workflow"
            echo "::error::恢复方法：网页端新建分支指向 pre-clean-backup tag 可还原清洗前状态"
            exit 1
          }

      - name: 清洗结果汇总
        run: |
          echo "=============================================="
          echo "✅ 清洗完成，结果如下："
          echo "  1. 备份 tag: pre-clean-backup（完整历史锚点，勿删）"
          echo "  2. 残留工作流: 已删除 android-ci / build-native"
          echo "  3. actions: setup-java 已升级 v5"
          echo "  4. 重复发布: build-coexist 不再响应 tag"
          echo "  5. 历史: 已 squash 为单提交"
          echo "  6. main 已更新（force push）"
          echo "=============================================="
          echo "下一步：删除本工作流文件后，历史中不再有 clean-repo.yml"
          echo "（本文件已从提交中排除，如仍显示请忽略）"
