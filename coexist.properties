# ============================================================
# Winlator 共存版配置文件
# 修改这里的 app.id 即可更换包名，CI 会自动应用到所有层
# ============================================================

# 【硬约束】包名必须与 com.winlator 等长（12 个字符，含点号）
# 原因：glibc rootfs 中 163 个二进制文件（libc.so.6 等）硬编码了
#       /data/data/com.winlator/files/rootfs/ 前缀，烧进 ELF 字符串表。
#       不等长替换会破坏 ELF 结构导致闪退。等长替换不改变字符串长度，安全。
# 可用示例（均为 12 字符）：
#   org.winlator   net.winlator   io.winlator
#   com.winlatorx  (13字符，不可用)
#   com.winlator   (原版，不可与原版共存)
app.id=org.winlator

# 版本号偏移：共存版 versionCode = 上游 versionCode + 此值
# 避免与原版 versionCode 冲突（原版 32，共存版 1032）
version.code.offset=1000

# 发布前是否执行静态自检（签名/包名/native库/assets/大小）
pre.release.check=true

# 发布时是否生成更新日志
generate.changelog=true
